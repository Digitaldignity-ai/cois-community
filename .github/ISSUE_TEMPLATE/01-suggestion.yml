name: Suggest an improvement
description: Propose an idea for continuity, usability, accessibility or interoperability.
title: "[Suggestion] "
labels: ["type: suggestion", "status: proposed"]
body:
  - type: markdown
    attributes:
      value: |
        This form is public. Use synthetic examples; do not include private conversations, credentials, personal data or infrastructure details.
        Suspected vulnerabilities or data exposure: use [private reporting](https://github.com/Digitaldignity-ai/cois-community/security/advisories/new).
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to improve?
      description: A short idea is enough. An implementation is not required.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Examples, alternatives or unanswered questions
      description: Public references and synthetic examples are welcome. Say what is observed and what is proposed.
  - type: input
    id: credit
    attributes:
      label: Contributor credit (optional)
      description: Public handles or related public work you would like credited. No private contact details.
  - type: checkboxes
    id: public-check
    attributes:
      label: Before posting
      options:
        - label: I have checked that this contribution is safe and authorized to publish publicly.
          required: true
